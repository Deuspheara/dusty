<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#9B82FF"/>
      <stop offset="1" stop-color="#6A4BEA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE6FF"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2B1680" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824x824 squircle centered, 100px margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <!-- dust specks being swept away -->
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="232" cy="760" r="14"/>
    <circle cx="196" cy="690" r="9"/>
    <circle cx="268" cy="824" r="8"/>
  </g>
  <g filter="url(#drop)" stroke="#3D2C7A" stroke-width="22" stroke-linejoin="round">
    <!-- main pad -->
    <path fill="url(#fur)" d="M512 520c-70 0-118 52-150 104-30 49-62 78-62 128 0 52 42 88 96 88 46 0 74-24 116-24s70 24 116 24c54 0 96-36 96-88 0-50-32-79-62-128-32-52-80-104-150-104z"/>
    <!-- toes -->
    <ellipse fill="url(#fur)" cx="318" cy="472" rx="66" ry="82" transform="rotate(-22 318 472)"/>
    <ellipse fill="url(#fur)" cx="438" cy="370" rx="68" ry="88" transform="rotate(-7 438 370)"/>
    <ellipse fill="url(#fur)" cx="586" cy="370" rx="68" ry="88" transform="rotate(7 586 370)"/>
    <ellipse fill="url(#fur)" cx="706" cy="472" rx="66" ry="82" transform="rotate(22 706 472)"/>
  </g>
  <!-- toe beans -->
  <g fill="#FF9DB5">
    <path d="M512 610c-44 0-72 34-92 66-18 28-36 46-36 74 0 26 22 42 48 42 30 0 46-16 80-16s50 16 80 16c26 0 48-16 48-42 0-28-18-46-36-74-20-32-48-66-92-66z"/>
    <ellipse cx="322" cy="486" rx="34" ry="44" transform="rotate(-22 322 486)"/>
    <ellipse cx="440" cy="386" rx="35" ry="47" transform="rotate(-7 440 386)"/>
    <ellipse cx="584" cy="386" rx="35" ry="47" transform="rotate(7 584 386)"/>
    <ellipse cx="702" cy="486" rx="34" ry="44" transform="rotate(22 702 486)"/>
  </g>
  <!-- bean shine -->
  <g fill="#FFFFFF" opacity="0.7">
    <ellipse cx="470" cy="660" rx="22" ry="12" transform="rotate(-30 470 660)"/>
    <ellipse cx="426" cy="364" rx="10" ry="16" transform="rotate(-7 426 364)"/>
    <ellipse cx="572" cy="364" rx="10" ry="16" transform="rotate(7 572 364)"/>
  </g>
  <!-- sparkle: clean! -->
  <path fill="#FFD25E" stroke="#3D2C7A" stroke-width="14" stroke-linejoin="round"
        d="M792 196c10 52 30 72 82 82-52 10-72 30-82 82-10-52-30-72-82-82 52-10 72-30 82-82z"/>
  <path fill="#FFFFFF" d="M234 236c6 28 16 38 44 44-28 6-38 16-44 44-6-28-16-38-44-44 28-6 38-16 44-44z" opacity="0.9"/>
</svg>
