<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Dusty peeking over the bottom edge of the icon. Art: dusty-front.png (cut from app/assets/dusty-sheet.png). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#9A82FF"/>
      <stop offset="1" stop-color="#6544E6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2B1680" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <g fill="#FFFFFF" opacity="0.5">
      <circle cx="190" cy="300" r="10"/><circle cx="230" cy="250" r="6"/><circle cx="840" cy="560" r="9"/><circle cx="170" cy="640" r="7"/>
    </g>
    <image href="dusty-front.png" xlink:href="dusty-front.png" x="48" y="200" width="960" height="860" filter="url(#shadow)"/>
  </g>
  <path fill="#FFD25E" stroke="#4A3D60" stroke-width="12" stroke-linejoin="round"
        d="M806 168c9 46 27 64 73 73-46 9-64 27-73 73-9-46-27-64-73-73 46-9 64-27 73-73z"/>
  <path fill="#FFFFFF" d="M230 170c5 26 15 36 41 41-26 5-36 15-41 41-5-26-15-36-41-41 26-5 36-15 41-41z" opacity="0.9"/>
</svg>
