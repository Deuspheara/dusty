# Monthly, grouped: one PR per ecosystem instead of a stream of them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /app
    schedule: { interval: monthly }
    groups:
      cargo: { patterns: ["*"] }
