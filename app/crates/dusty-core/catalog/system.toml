args = ["Library/Application Support/Slack", "Library/Containers/com.tinyspeck.slackmacgap/Data/Library/Application Support/Slack"]
running = { app = "Slack", process = "/Slack.app/Contents/MacOS/" }

[[target]]
id = "zoom-cache"
label = "Zoom cache"
group = "apps"
default_on = true
contents = ["Library/Caches/us.zoom.xos"]
running = { app = "Zoom", process = "/zoom.us.app/Contents/MacOS/" }

[[target]]
id = "teams-cache"
label = "Microsoft Teams cache"
group = "apps"
default_on = true
contents = ["Library/Caches/com.microsoft.teams2", "Library/Containers/com.microsoft.teams2/Data/Library/Caches"]
running = { app = "Teams", process = '/Microsoft Teams.*\.app/Contents/MacOS/' }

[[target]]
id = "whatsapp-cache"
label = "WhatsApp cache"
group = "apps"
default_on = true
contents = ["Library/Caches/net.whatsapp.WhatsApp"]
running = { app = "WhatsApp", process = "/WhatsApp.app/Contents/MacOS/" }

[[target]]
id = "telegram-cache"
