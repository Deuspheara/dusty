running = { app = "a video player", process = "/(VLC|IINA|Plex).app/Contents/MacOS/" }

[[target]]
id = "ai-app-cache"
label = "ChatGPT & Claude app caches"
group = "apps"
default_on = true
contents = ["Library/Caches/com.openai.chat", "Library/Caches/com.anthropic.claudefordesktop", "Library/Logs/Claude"]
running = { app = "ChatGPT or Claude", process = "/(ChatGPT|Claude).app/Contents/MacOS/" }

# ───────── leftovers ─────────

[[target]]
id = "incomplete-downloads"
label = "Unfinished downloads (older than a week)"
group = "junk"
default_on = true
contents = ["Downloads"]
files_only = true
older_than_days = 7
extensions = [".crdownload", ".part", ".download", ".opdownload", ".partial"]

[[target]]
id = "mail-downloads"
label = "Mail attachment copies (older than 30 days)"
group = "junk"
default_on = true
contents = ["Library/Containers/com.apple.mail/Data/Library/Mail Downloads"]
files_only = true
older_than_days = 30

[[target]]
id = "old-installers"
label = "Old installers in Downloads (.dmg, .pkg)"
group = "redownload"
contents = ["Downloads"]
files_only = true
older_than_days = 30
extensions = [".dmg", ".pkg"]

[[target]]
id = "ios-updates"
label = "iPhone & iPad update files"
group = "redownload"
contents = ["Library/iTunes/iPhone Software Updates", "Library/iTunes/iPad Software Updates"]
files_only = true
extensions = [".ipsw"]

# ───────── Docker (what `docker system df` says is reclaimable) ─────────

[[target]]
id = "docker-buildcache"
label = "Docker build cache"
group = "docker"
default_on = true
provider = "docker"
args = ["Build Cache", "builder", "prune", "-af"]

[[target]]
id = "docker-containers"
label = "Docker stopped containers"
group = "docker"
default_on = true
provider = "docker"
args = ["Containers", "container", "prune", "-f"]

[[target]]
id = "docker-images"
label = "Docker unused images"
group = "docker"
provider = "docker"
args = ["Images", "image", "prune", "-af"]

[[target]]
id = "docker-volumes"
label = "Docker volumes ⚠ data"
group = "docker"
wipes_data = true
provider = "docker"
args = ["Local Volumes", "volume", "prune", "-af"]
