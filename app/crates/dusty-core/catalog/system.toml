[[target]]
id = "safari-cache"
label = "Safari cache"
group = "apps"
default_on = true
contents = ["Library/Caches/com.apple.Safari"]
running = { app = "Safari", process = "/Safari.app/Contents/MacOS/" }

[[target]]
id = "chrome-cache"
label = "Chrome cache"
group = "apps"
default_on = true
provider = "chromium"
args = ["Google/Chrome", "Google/Chrome"]
running = { app = "Chrome", process = "/Google Chrome.app/Contents/MacOS/" }

[[target]]
id = "edge-cache"
label = "Edge cache"
group = "apps"
default_on = true
provider = "chromium"
args = ["Microsoft Edge", "com.microsoft.edgemac"]
running = { app = "Edge", process = "/Microsoft Edge.app/Contents/MacOS/" }

[[target]]
