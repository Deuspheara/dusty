contents = ["Library/Application Support/Adobe/Common/Media Cache Files"]
running = { app = "an Adobe video app", process = "Adobe (Premiere|After Effects|Audition|Media Encoder|Character Animator)" }

[[target]]
id = "apple-media-cache"
label = "Music, TV & Podcasts caches"
group = "apps"
default_on = true
