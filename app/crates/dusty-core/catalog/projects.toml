# Build outputs and downloaded dependencies inside your projects.
#
# A folder is offered only when its parent folder holds one of the `markers` (a file name, or `*.ext`
# for any file with that extension). Inside a git repo it must also be git-ignored: a tracked `build/`
# is source code. First match wins, so put the more specific rule first.
#
#   dir        the folder name (or `prefix` for names that start with it, like cmake-build-debug)
#   markers    files the parent must contain; "@name" pulls in a list from [markers] below;
#              empty only for names no tool uses for source
#   kind       what the app and the CLI call it
#   redownload true when getting it back costs a download (off by default, its own group)

[markers]
gradle = ["build.gradle", "build.gradle.kts", "settings.gradle", "settings.gradle.kts", "gradlew"]
js = ["package.json"]
py = ["pyproject.toml", "setup.py", "setup.cfg", "requirements.txt", "tox.ini", "noxfile.py"]
nuxt = ["nuxt.config.ts", "nuxt.config.js", "nuxt.config.mjs"]
dotnet = ["*.csproj", "*.fsproj", "*.vbproj"]

[[rule]]
dir = "build"
markers = ["pubspec.yaml"]
kind = "Flutter build"

[[rule]]
dir = ".dart_tool"
markers = ["pubspec.yaml"]
kind = "Dart tool cache"

[[rule]]
dir = "ephemeral"
markers = ["generated_plugin_registrant.cc", "generated_plugins.cmake", "CMakeLists.txt", "Podfile"]
kind = "Flutter ephemeral"

[[rule]]
dir = "build"
markers = ["@gradle"]
kind = "Gradle build"

[[rule]]
dir = ".gradle"
