[package]
name = "dusty-cli"
description = "Dusty in a terminal: same engine and safety rules as the app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "dusty"
path = "src/main.rs"

[dependencies]
dusty-core = { path = "../dusty-core" }
dusty-ai = { path = "../dusty-ai" }
clap = { version = "4.5", features = ["derive"] }
dialoguer = { version = "0.12", default-features = false }
console = "0.16"
serde_json = "1"

[lints]
workspace = true
