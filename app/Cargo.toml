[workspace]
members = ["crates/dusty-core", "crates/dusty-ai", "crates/dusty-cli"]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/Deuspheara/dusty"

[workspace.lints.rust]
# objc 0.2's msg_send! expands to `cfg(feature = "cargo-clippy")`; accept it instead of warning on every call
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[package]
name = "dusty"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "dusty-app"
description = "Dusty: a playful macOS disk cleaner that never throws away what you would have to re-download."

# the app's binary is dusty-app (bundled as Dusty.app/Contents/MacOS/Dusty); `dusty` is the CLI
[[bin]]
name = "dusty-app"
path = "src/main.rs"

[dependencies]
dusty-core = { path = "crates/dusty-core" }
dusty-ai = { path = "crates/dusty-ai" }
# gpui-pre: weekly crates.io snapshots of Zed's GPUI (official `gpui` stopped at 0.2.2)
gpui = { package = "gpui-pre", version = "0.3.13", default-features = false, features = ["font-kit"] }
# runtime_shaders: Metal shaders are compiled at launch, so building needs no Metal toolchain
# font-kit: glyph rasterization on macOS (without it text lays out but draws nothing)
gpui_platform = { package = "gpui-pre-platform", version = "0.3.13", default-features = false, features = ["font-kit", "runtime_shaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
raw-window-handle = "0.6"
anyhow = "1"
futures = "0.3"

[features]
# `cargo run --features profile` + DUSTY_TRACE=1: gpui-pre's frame profiler (draw times, frame pacing, on-screen overlay)
profile = ["gpui/profiler"]

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
metal = "0.29"

[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

[lints]
workspace = true
